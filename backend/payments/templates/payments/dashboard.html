{% extends "base.html" %}

{% block title %}Payments Dashboard{% endblock %}

{% block content %}
<section>
    <h2>Dashboard</h2>
    <div class="cards">
        <article class="card">
            <h3>Payment Records</h3>
            <p>{{ record_count }}</p>
        </article>
        <article class="card">
            <h3>Open Settlements</h3>
            <p>{{ open_settlement_count }}</p>
        </article>
        <article class="card">
            <h3>Paid Settlements</h3>
            <p>{{ paid_settlement_count }}</p>
        </article>
    </div>
</section>
{% endblock %}
