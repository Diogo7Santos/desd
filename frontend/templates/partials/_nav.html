<nav style="
    background:#2e7d32;
    color:white;
    padding:12px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
">

    <!-- LOGO / BRAND -->
    <div>
        <a href="{% url 'home' %}" style="
            color:white;
            text-decoration:none;
            font-weight:700;
            font-size:18px;
        ">
            Local Food Network
        </a>
    </div>

    <!-- NAV LINKS -->
    <div style="display:flex; gap:18px; align-items:center; flex-wrap:wrap;">

        <a href="{% url 'home' %}" style="color:white; text-decoration:none;">Home</a>
        <a href="{% url 'product_list' %}" style="color:white; text-decoration:none;">Products</a>
        <a href="{% url 'cart' %}" style="color:white; text-decoration:none;">Cart</a>

        {% if user.is_authenticated %}

            <a href="{% url 'dashboard' %}" style="color:white; text-decoration:none;">Dashboard</a>
            <a href="{% url 'profile' %}" style="color:white; text-decoration:none;">Profile</a>

            <a href="{% url 'logout' %}" style="
                color:white;
                text-decoration:none;
                background:#1b5e20;
                padding:6px 10px;
                border-radius:5px;
            ">
                Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}" style="color:white; text-decoration:none;">Login</a>
            <a href="{% url 'register' %}" style="
                color:white;
                text-decoration:none;
                background:#1b5e20;
                padding:6px 10px;
                border-radius:5px;
            ">
                Register
            </a>

        {% endif %}

    </div>
</nav>
